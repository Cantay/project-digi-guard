# Sunucudaki nginx için: /etc/nginx/sites-available/digi-guard.conf
# Alan adları ve port (8088 = .env → SITE_PORT) kendi değerlerinizle aynı olmalı.
# İlk kurulumda sertifika yoksa önce yalnızca 80 bloğunu etkinleştirip
#   sudo certbot --nginx -d www.digi-guard.com -d digi-guard.com
# çalıştırın; certbot 443 bloğundaki sertifika yollarını doldurur.

upstream digi_guard_site {
    server 127.0.0.1:8088;
    keepalive 16;
}

# http → https, kök alan → www
server {
    listen 80;
    listen [::]:80;
    server_name digi-guard.com www.digi-guard.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.digi-guard.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name digi-guard.com;

    ssl_certificate     /etc/letsencrypt/live/www.digi-guard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.digi-guard.com/privkey.pem;

    return 301 https://www.digi-guard.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.digi-guard.com;

    ssl_certificate     /etc/letsencrypt/live/www.digi-guard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.digi-guard.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://digi_guard_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
