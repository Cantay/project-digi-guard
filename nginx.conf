server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/xml image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Pictures and logos: long cache (names change only with a new build).
    location /img/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # İletişim formu: compose'daki api servisine.
    location /api/ {
        client_max_body_size 32k;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ziyaretçinin adresi sunucudaki nginx'ten gelir (gönderim sınırı için).
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_read_timeout 45s;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /index.html;
}
