# Digi-Guard web sitesi. Sunucudaki nginx önde durur (alan adı, TLS); bu konteyner
# yalnızca sunucunun kendisine açılır: 127.0.0.1:${SITE_PORT}.
#
#   cp .env.example .env
#   docker compose up -d --build
#   sudo cp deploy/nginx-digi-guard.conf /etc/nginx/sites-available/digi-guard.conf  (bkz. README)
name: digi-guard

services:
  site:
    build:
      context: .
      args:
        SITE_URL: https://${SITE_DOMAIN:?SITE_DOMAIN gerekli (ör. www.digi-guard.com)}
    image: digi-guard/site:${TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${SITE_PORT:-8088}:8080"
    depends_on:
      - api

  # İletişim formu: /api/contact → SMTP ile e-posta. Dışarı açılmaz; site nginx'i iletir.
  api:
    build: ./api
    image: digi-guard/api:${TAG:-latest}
    restart: unless-stopped
    read_only: true
    environment:
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST gerekli}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-kurumsal@digi-guard.com}
      TRUST_PROXY: "1"
